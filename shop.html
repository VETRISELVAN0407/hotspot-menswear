<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All — HOTSPOT</title>
<meta name="description" content="HOTSPOT menswear: tees, hoodies, shirts and knitwear made to be worn every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body class="home">
<div id="site-header"></div>
<main>
<section class="home-hero" aria-label="Featured">
  <img class="hair" src="images/home-hair.png" alt="">
  <div class="hero-copy">
    <span class="hero-eyebrow"><i></i>THE NEW <em>MENSWEAR EDIT</em></span>
    <h1>Everyday essentials.<br>Elevated.</h1>
    <p>Discover timeless pieces designed for everyday confidence.</p>
    <a class="hero-btn" href="#catalog">EXPLORE COLLECTION <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
    <div class="hero-dots"><i class="on"></i><i></i><i></i></div>
  </div>
</section>
<div class="sbc shop-bg">
  <svg class="sbc-arc" viewBox="0 0 200 400" aria-hidden="true"><path d="M190 0C60 40 10 160 40 300c10 40 40 80 90 100" fill="none" stroke="#d9bd96" stroke-width="1.2"/></svg>
  <svg class="sbc-leaf" viewBox="0 0 220 220" aria-hidden="true"><g fill="#8a9a6a" opacity=".75"><path d="M0 220C20 140 80 90 150 80c-20 50-60 100-150 140z"/><path d="M0 220C40 170 60 120 40 60c40 30 60 90 30 160z" opacity=".7"/></g></svg>
  <div class="sbc-curve" aria-hidden="true"></div>
  <div class="sbc-ghost" aria-hidden="true">Shop All</div>
  <section class="catalog" id="catalog"></section>
</div>
</main>
<div id="site-footer"></div>
<script src="shared.js"></script>
<script src="catalog.js"></script>
<script>
mountCatalog($('#catalog'),({cat,q})=>{
  if(!q)history.replaceState(null,'','shop.html'+(cat==='all'?'':'?c='+cat));
});
</script>
</body>
</html>
